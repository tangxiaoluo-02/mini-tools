<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業簡報倒數計時器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap');
        
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'JetBrains+Mono', monospace;
            overflow: hidden;
        }

        .timer-display {
            font-size: 25vw;
            line-height: 1;
            transition: color 0.3s ease;
        }

        .status-green { color: #10b981; }
        .status-yellow { color: #f59e0b; }
        .status-red { color: #ef4444; }
        
        .overtime {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .progress-bar {
            height: 8px;
            transition: width 1s linear, background-color 0.3s;
        }

        button {
            transition: all 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen relative">

    <!-- 頂部進度條 -->
    <div class="fixed top-0 left-0 w-full bg-gray-800">
        <div id="progress" class="progress-bar bg-emerald-500 w-full"></div>
    </div>

    <!-- 計時顯示區 -->
    <div id="display-container" class="flex flex-col items-center">
        <div id="timer" class="timer-display status-green">00:00</div>
        <div id="overtime-label" class="text-2xl font-bold text-red-500 opacity-0 uppercase tracking-widest">Time Over</div>
    </div>

    <!-- 控制面板 -->
    <div id="controls" class="mt-8 space-y-6 w-full max-w-2xl px-6">
        
        <!-- 預設按鈕 -->
        <div class="grid grid-cols-4 gap-4">
            <button onclick="setTime(300)" class="bg-gray-800 hover:bg-gray-700 py-3 rounded-lg text-lg border border-gray-600">5 min</button>
            <button onclick="setTime(600)" class="bg-gray-800 hover:bg-gray-700 py-3 rounded-lg text-lg border border-gray-600">10 min</button>
            <button onclick="setTime(900)" class="bg-gray-800 hover:bg-gray-700 py-3 rounded-lg text-lg border border-gray-600">15 min</button>
            <button onclick="setTime(1200)" class="bg-gray-800 hover:bg-gray-700 py-3 rounded-lg text-lg border border-gray-600">20 min</button>
        </div>

        <!-- 自定義輸入與主要操作 -->
        <div class="flex items-center space-x-4 bg-gray-900 p-4 rounded-xl border border-gray-700">
            <div class="flex-1 flex items-center space-x-2">
                <input type="number" id="input-m" placeholder="分" class="w-20 bg-black border border-gray-600 rounded px-2 py-1 text-center text-xl focus:outline-none focus:border-emerald-500">
                <span>:</span>
                <input type="number" id="input-s" placeholder="秒" class="w-20 bg-black border border-gray-600 rounded px-2 py-1 text-center text-xl focus:outline-none focus:border-emerald-500">
                <button onclick="setCustomTime()" class="text-sm text-gray-400 hover:text-white px-2 italic underline">設定</button>
            </div>

            <div class="flex space-x-3">
                <button id="btn-start" onclick="toggleTimer()" class="bg-emerald-600 hover:bg-emerald-500 px-8 py-2 rounded-lg font-bold">START</button>
                <button onclick="resetTimer()" class="bg-gray-700 hover:bg-gray-600 px-6 py-2 rounded-lg">RESET</button>
                <button onclick="toggleFullscreen()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M1.5 1a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4A1.5 1.5 0 0 1 1.5 0h4a.5.5 0 0 1 0 1h-4zM10 .5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 16 1.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5zM.5 10a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 0 14.5v-4a.5.5 0 0 1 .5-.5zm15 0a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1.5 1.5h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <p class="fixed bottom-4 text-gray-600 text-xs uppercase tracking-widest">Space to Start/Pause | R to Reset | F to Fullscreen</p>

    <script>
        let totalSeconds = 0;
        let initialSeconds = 0;
        let timerInterval = null;
        let isRunning = false;

        const display = document.getElementById('timer');
        const progressBar = document.getElementById('progress');
        const startBtn = document.getElementById('btn-start');
        const overtimeLabel = document.getElementById('overtime-label');

        function updateDisplay() {
            let absSeconds = Math.abs(totalSeconds);
            let mins = Math.floor(absSeconds / 60);
            let secs = absSeconds % 60;
            
            let displayStr = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            display.innerText = (totalSeconds < 0 ? "-" : "") + displayStr;

            // 處理顏色與警示
            if (totalSeconds < 0) {
                display.className = "timer-display status-red overtime";
                overtimeLabel.style.opacity = "1";
                progressBar.style.width = "100%";
                progressBar.classList.replace('bg-emerald-500', 'bg-red-600');
            } else {
                let ratio = totalSeconds / initialSeconds;
                overtimeLabel.style.opacity = "0";
                display.classList.remove('overtime');
                
                if (ratio <= 0.1) {
                    display.className = "timer-display status-red";
                    progressBar.className = "progress-bar bg-red-500";
                } else if (ratio <= 0.2) {
                    display.className = "timer-display status-yellow";
                    progressBar.className = "progress-bar bg-amber-500";
                } else {
                    display.className = "timer-display status-green";
                    progressBar.className = "progress-bar bg-emerald-500";
                }
                
                progressBar.style.width = (ratio * 100) + "%";
            }
        }

        function setTime(s) {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.innerText = "START";
            totalSeconds = s;
            initialSeconds = s;
            updateDisplay();
        }

        function setCustomTime() {
            let m = parseInt(document.getElementById('input-m').value) || 0;
            let s = parseInt(document.getElementById('input-s').value) || 0;
            setTime((m * 60) + s);
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                startBtn.innerText = "RESUME";
            } else {
                if (totalSeconds === 0 && initialSeconds === 0) return;
                timerInterval = setInterval(() => {
                    totalSeconds--;
                    updateDisplay();
                }, 1000);
                startBtn.innerText = "PAUSE";
            }
            isRunning = !isRunning;
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            totalSeconds = initialSeconds;
            startBtn.innerText = "START";
            updateDisplay();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                document.getElementById('controls').classList.add('opacity-0', 'hover:opacity-100', 'transition-opacity');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    document.getElementById('controls').classList.remove('opacity-0');
                }
            }
        }

        // 鍵盤快捷鍵
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') { e.preventDefault(); toggleTimer(); }
            if (e.code === 'KeyR') resetTimer();
            if (e.code === 'KeyF') toggleFullscreen();
        });
    </script>
</body>
</html>
