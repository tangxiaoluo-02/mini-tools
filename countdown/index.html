<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業簡報倒數計時器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap');

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
        }

        .timer-display {
            font-size: clamp(4rem, 22vw, 18rem);
            line-height: 1;
            transition: color 0.3s ease;
        }

        .status-green  { color: #10b981; }
        .status-yellow { color: #f59e0b; }
        .status-red    { color: #ef4444; }

        .overtime { animation: blink 1s infinite; }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.3; }
        }

        .progress-bar {
            height: 8px;
            transition: width 1s linear, background-color 0.3s;
        }

        button { transition: all 0.2s; }
        button:active { transform: scale(0.95); }

        /* 控制面板淡入淡出 */
        #controls, #bottom-hint {
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #controls.hidden-ui, #bottom-hint.hidden-ui {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #ios-toast {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 14px;
            padding: 14px 20px;
            font-size: 0.85rem;
            text-align: center;
            line-height: 1.6;
            width: 88%;
            max-width: 360px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 50;
        }
        #ios-toast.show { opacity: 1; }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen relative">

    <!-- 頂部進度條 -->
    <div class="fixed top-0 left-0 w-full bg-gray-800">
        <div id="progress" class="progress-bar bg-emerald-500 w-full"></div>
    </div>

    <!-- 計時顯示 -->
    <div class="flex flex-col items-center mb-4">
        <div id="timer" class="timer-display status-green">00:00</div>
        <div id="overtime-label" class="text-xl font-bold text-red-500 opacity-0 uppercase tracking-widest">Time Over</div>
    </div>

    <!-- 控制面板 -->
    <div id="controls" class="w-full max-w-lg px-4 space-y-3">

        <!-- 預設時間 -->
        <div class="grid grid-cols-4 gap-2">
            <button onclick="setTime(300)"  class="bg-gray-800 hover:bg-gray-700 py-3 rounded-lg text-base border border-gray-600">5 min</button>
            <button onclick="setTime(600)"  class="bg-gray-800 hover:bg-gray-700 py-3 rounded-lg text-base border border-gray-600">10 min</button>
            <button onclick="setTime(900)"  class="bg-gray-800 hover:bg-gray-700 py-3 rounded-lg text-base border border-gray-600">15 min</button>
            <button onclick="setTime(1200)" class="bg-gray-800 hover:bg-gray-700 py-3 rounded-lg text-base border border-gray-600">20 min</button>
        </div>

        <!-- 自訂輸入 -->
        <div class="flex items-center gap-2 bg-gray-900 px-4 py-3 rounded-xl border border-gray-700">
            <input type="number" id="input-m" placeholder="分" min="0"
                   class="w-16 bg-black border border-gray-600 rounded px-2 py-1 text-center text-lg focus:outline-none focus:border-emerald-500">
            <span class="text-gray-400">:</span>
            <input type="number" id="input-s" placeholder="秒" min="0" max="59"
                   class="w-16 bg-black border border-gray-600 rounded px-2 py-1 text-center text-lg focus:outline-none focus:border-emerald-500">
            <button onclick="setCustomTime()" class="text-sm text-gray-400 hover:text-white px-2 italic underline whitespace-nowrap">設定</button>
        </div>

        <!-- 主操作 -->
        <div class="flex gap-2">
            <button id="btn-start" onclick="toggleTimer()"
                    class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold text-lg">START</button>
            <button onclick="resetTimer()"
                    class="flex-1 bg-gray-700 hover:bg-gray-600 py-3 rounded-xl font-bold text-lg">RESET</button>
            <button onclick="toggleFullscreen()" title="全螢幕"
                    class="bg-gray-700 hover:bg-gray-600 px-4 py-3 rounded-xl">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M1.5 1a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4A1.5 1.5 0 0 1 1.5 0h4a.5.5 0 0 1 0 1h-4zM10 .5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 16 1.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5zM.5 10a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 0 14.5v-4a.5.5 0 0 1 .5-.5zm15 0a.5.5 0 0 1 .5.5v4a1.5 1.5 0 0 1-1.5 1.5h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5z"/>
                </svg>
            </button>
        </div>
    </div>

    <p id="bottom-hint" class="fixed bottom-4 text-gray-600 text-xs uppercase tracking-widest text-center">
        Space to Start/Pause &nbsp;|&nbsp; R to Reset &nbsp;|&nbsp; F to Fullscreen
    </p>

    <!-- iOS 全螢幕提示 -->
    <div id="ios-toast">
        📱 iPhone 不支援網頁全螢幕<br>
        點瀏覽器下方 <strong>分享 → 加入主畫面</strong><br>
        從主畫面開啟即可全螢幕 ✅
    </div>

    <script>
        let totalSeconds = 0;
        let initialSeconds = 0;
        let timerInterval = null;
        let isRunning = false;

        const display       = document.getElementById('timer');
        const progressBar   = document.getElementById('progress');
        const startBtn      = document.getElementById('btn-start');
        const overtimeLabel = document.getElementById('overtime-label');
        const controls      = document.getElementById('controls');
        const bottomHint    = document.getElementById('bottom-hint');
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        let autoHideTimer = null;

        function hideUI() {
            controls.classList.add('hidden-ui');
            bottomHint.classList.add('hidden-ui');
        }

        function showUITemporarily() {
            controls.classList.remove('hidden-ui');
            bottomHint.classList.remove('hidden-ui');
            clearTimeout(autoHideTimer);
            // 若計時器正在跑，3 秒後自動再隱藏
            if (isRunning) {
                autoHideTimer = setTimeout(hideUI, 3000);
            }
        }

        // 點擊 / 觸控螢幕時顯示控制面板
        document.addEventListener('click', (e) => {
            if (!isRunning) return;
            // 若面板已隱藏（點擊空白處）→ 顯示
            // 若面板可見（點在按鈕上）→ 重設計時器，不干涉
            if (controls.classList.contains('hidden-ui')) {
                showUITemporarily();
            } else {
                // 點在按鈕以外的地方 → 重設自動隱藏計時
                if (e.target === document.body || e.target.tagName === 'DIV') {
                    clearTimeout(autoHideTimer);
                    autoHideTimer = setTimeout(hideUI, 3000);
                }
            }
        });

        function updateDisplay() {
            let abs  = Math.abs(totalSeconds);
            let mins = Math.floor(abs / 60);
            let secs = abs % 60;
            display.innerText = (totalSeconds < 0 ? "-" : "") +
                `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;

            if (totalSeconds < 0) {
                display.className = "timer-display status-red overtime";
                overtimeLabel.style.opacity = "1";
                progressBar.style.width = "100%";
                progressBar.style.backgroundColor = "#dc2626";
            } else {
                let ratio = initialSeconds > 0 ? totalSeconds / initialSeconds : 0;
                overtimeLabel.style.opacity = "0";
                display.classList.remove('overtime');
                if (ratio <= 0.1) {
                    display.className = "timer-display status-red";
                    progressBar.style.backgroundColor = "#ef4444";
                } else if (ratio <= 0.2) {
                    display.className = "timer-display status-yellow";
                    progressBar.style.backgroundColor = "#f59e0b";
                } else {
                    display.className = "timer-display status-green";
                    progressBar.style.backgroundColor = "#10b981";
                }
                progressBar.style.width = (ratio * 100) + "%";
            }
        }

        function setTime(s) {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.innerText = "START";
            totalSeconds = initialSeconds = s;
            updateDisplay();
        }

        function setCustomTime() {
            let m = parseInt(document.getElementById('input-m').value) || 0;
            let s = parseInt(document.getElementById('input-s').value) || 0;
            setTime(m * 60 + s);
        }

        function toggleTimer() {
            if (isRunning) {
                // 暫停 → 顯示按鈕
                clearInterval(timerInterval);
                clearTimeout(autoHideTimer);
                startBtn.innerText = "RESUME";
                showUITemporarily();
            } else {
                if (totalSeconds === 0 && initialSeconds === 0) return;
                timerInterval = setInterval(() => { totalSeconds--; updateDisplay(); }, 1000);
                startBtn.innerText = "PAUSE";
                // 開始計時 → 1 秒後隱藏按鈕
                autoHideTimer = setTimeout(hideUI, 1000);
            }
            isRunning = !isRunning;
        }

        function resetTimer() {
            clearInterval(timerInterval);
            clearTimeout(autoHideTimer);
            isRunning = false;
            totalSeconds = initialSeconds;
            startBtn.innerText = "START";
            updateDisplay();
            showUITemporarily(); // reset 後顯示按鈕
        }

        function toggleFullscreen() {
            if (isIOS) {
                const toast = document.getElementById('ios-toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 4000);
                return;
            }
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                document.getElementById('controls').classList.add('opacity-0', 'hover:opacity-100', 'transition-opacity');
            } else {
                document.exitFullscreen();
                document.getElementById('controls').classList.remove('opacity-0');
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') { e.preventDefault(); toggleTimer(); }
            if (e.code === 'KeyR') resetTimer();
            if (e.code === 'KeyF') toggleFullscreen();
        });
    </script>
</body>
</html>
